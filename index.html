<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com Modo Escuro</title>
    <style>
        /* Variáveis de cores para facilitar a troca de temas */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --button-bg: #1a1a1a;
            --button-text: #ffffff;
            --card-bg: #f0f0f0;
        }

        /* Cores que serão aplicadas no modo escuro */
        .dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f5f5f5;
            --button-bg: #ffffff;
            --button-text: #1a1a1a;
            --card-bg: #2d2d2d;
        }

        /* Estilização geral da página */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s; /* Transição suave ao mudar o tema */
        }

        /* Estilo do container principal */
        .container {
            text-align: center;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        /* Estilo do botão */
        .toggle-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .toggle-btn:hover {
            opacity: 0.9;
        }

        /* Estilo da imagem */
        .site-image {
            max-width: 100%;
            height: auto;
            width: 400px;
            border-radius: 8px;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botão que vai alternar o tema -->
        <button class="toggle-btn" id="themeToggle">Alternar Modo Escuro</button>
        
        <h1>Bem-vindo ao meu site!</h1>
        <p>Este é um exemplo simples de troca de tema usando variáveis CSS.</p>
        
        <!-- Imagem ilustrativa (você pode substituir o link src pela sua própria imagem) -->
        <img class="site-image" src="https://picsum.photos" alt="Imagem de demonstração">
    </div>

    <script>
        // Seleciona o botão e o corpo da página
        const toggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        // Adiciona um evento de clique ao botão
        toggleBtn.addEventListener('click', () => {
            // Alterna a classe 'dark-mode' no elemento body
            body.classList.toggle('dark-mode');
        });
    </script>

</body>
</html>
